name: Publish Library

on:
  workflow_call:
    secrets:
      # No longer needed for npmjs, but we'll still use GHCR_TOKEN
      GHCR_TOKEN:
        required: true

jobs:
  publish:
    name: publish library
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # required for npm Trusted Publishing
      packages: write
      contents: read

    steps:
      - name: checkout actions
        uses: actions/checkout@v6

      - name: setup node (npmjs)
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      # IMPORTANT: no .npmrc with _authToken, no NODE_AUTH_TOKEN here

      - name: ensure npm 11.5+
        run: |
          corepack enable
          corepack prepare npm@latest --activate
          npm --version

      - name: cache packages
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}

      - if: ${{ false == steps.cache-npm.outputs.cache-hit }}
        name: list packages
        continue-on-error: true
        run: npm list

      - name: run ci
        run: npm ci
        env:
          NODE_ENV: production
          VITE_MODE: production

      - name: build
        run: npm run release
        env:
          BUILD_TARGET: release
          NODE_ENV: production
          VITE_MODE: production
        continue-on-error: false

      # --- NPMJS PUBLISH VIA TRUSTED PUBLISHING (NO TOKEN) ---
      - name: publish to npm (trusted publishing)
        run: npm publish --tag beta --access public

      # --- GHCR PUBLISH still uses token / GHCR auth ---
      - name: setup node (ghcr)
        uses: actions/setup-node@v6
        with:
          registry-url: https://npm.pkg.github.com

      - name: publish to ghcr
        run: npm publish --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_TOKEN }}
